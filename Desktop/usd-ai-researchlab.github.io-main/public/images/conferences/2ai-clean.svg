<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="80" fill="white" stroke="#e5e7eb" stroke-width="1" rx="8"/>
  
  <!-- 2AI Icon -->
  <g transform="translate(15, 20)">
    <rect x="5" y="5" width="30" height="30" fill="url(#grad2)" opacity="0.1" rx="4"/>
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#grad2)" text-anchor="middle">2AI</text>
  </g>
  
  <!-- Text -->
  <text x="55" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#374151">Applied AI</text>
  <text x="55" y="50" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Conference</text>
</svg>
