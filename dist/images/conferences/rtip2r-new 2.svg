<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" style="background: linear-gradient(135deg, #7c2d12 0%, #dc2626 50%, #f87171 100%);">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Main Conference Badge -->
  <rect x="50" y="40" width="300" height="160" rx="20" fill="white" opacity="0.95" filter="url(#shadow)"/>
  
  <!-- Conference Title -->
  <text x="200" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#7c2d12">
    RTIP2R 2025
  </text>
  
  <!-- Full Conference Name -->
  <text x="200" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="600" fill="#dc2626">
    Real-Time Image Processing &amp; Pattern Recognition
  </text>
  
  <!-- Simple Animated Medical Cross -->
  <g transform="translate(200, 115)" opacity="0.7">
    <rect x="-12" y="-2" width="24" height="4" fill="#dc2626" rx="2">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="-2" y="-12" width="4" height="24" fill="#dc2626" rx="2">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Conference Focus Areas -->
  <text x="200" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#374151">
    Medical Imaging &amp; Healthcare AI
  </text>
  
  <!-- Publication Badge -->
  <rect x="120" y="170" width="160" height="20" rx="10" fill="#dc2626" opacity="0.85"/>
  <text x="200" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white" letter-spacing="0.3">
    PEER REVIEWED
  </text>
</svg>
