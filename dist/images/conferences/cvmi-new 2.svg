    <!-- Scanning Ring -->
    <circle r="25" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4,2" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="6s" repeatCount="indefinite"/>
