      </rect>
      <rect x="12" y="2" width="6" height="6" fill="#1e293b" rx="1">
        <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="2.0s" repeatCount="indefinite"/>
      </rect>
    </g>
    
    <!-- AI Enhancement Nodes -->
    <circle cx="-30" cy="0" r="3" fill="#475569">
