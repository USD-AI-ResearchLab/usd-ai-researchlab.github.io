    <!-- Cross-browser polyfills and compatibility -->
    <script>
      // Basic polyfills for older browsers
      if (!Array.prototype.includes) {
        Array.prototype.includes = function(searchElement) {
          return this.indexOf(searchElement) !== -1;
        };
      }
      
      if (!String.prototype.includes) {
        String.prototype.includes = function(search, start) {
          if (typeof start !== 'number') start = 0;
          if (start + search.length > this.length) return false;
          else return this.indexOf(search, start) !== -1;
        };
      }
      
      // Object.assign polyfill
      if (typeof Object.assign != 'function') {
        Object.assign = function(target) {
          if (target == null) throw new TypeError('Cannot convert undefined or null to object');
          var to = Object(target);
          for (var index = 1; index < arguments.length; index++) {
            var nextSource = arguments[index];
            if (nextSource != null) {
              for (var nextKey in nextSource) {
                if (Object.prototype.hasOwnProperty.call(nextSource, nextKey)) {
                  to[nextKey] = nextSource[nextKey];
                }
              }
            }
          }
          return to;
        };
      }
      
      // Promise polyfill for very old browsers
      if (typeof Promise === 'undefined') {
        window.Promise = function(executor) {
          var self = this;
          this.state = 'pending';
          this.value = undefined;
          this.handlers = [];
          
          function resolve(value) {
            if (self.state === 'pending') {
              self.state = 'fulfilled';
              self.value = value;
              self.handlers.forEach(function(handler) { handler.onFulfilled(value); });
              self.handlers = [];
            }
          }
          
          function reject(reason) {
            if (self.state === 'pending') {
              self.state = 'rejected';
              self.value = reason;
              self.handlers.forEach(function(handler) { handler.onRejected(reason); });
              self.handlers = [];
            }
          }
          
          this.then = function(onFulfilled, onRejected) {
            return new Promise(function(resolve, reject) {
              if (self.state === 'fulfilled') {
                try { resolve(onFulfilled ? onFulfilled(self.value) : self.value); }
                catch(e) { reject(e); }
              } else if (self.state === 'rejected') {
                try { reject(onRejected ? onRejected(self.value) : self.value); }
                catch(e) { reject(e); }
              } else {
                self.handlers.push({
                  onFulfilled: function(value) {
                    try { resolve(onFulfilled ? onFulfilled(value) : value); }
                    catch(e) { reject(e); }
                  },
                  onRejected: function(reason) {
                    try { reject(onRejected ? onRejected(reason) : reason); }
                    catch(e) { reject(e); }
                  }
                });
              }
            });
          };
          
          try { executor(resolve, reject); }
          catch(e) { reject(e); }
        };
      }

    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
