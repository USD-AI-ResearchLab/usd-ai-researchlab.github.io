<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI LAB - Artificial Intelligence Research & Innovation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        .container {
            max-width: 800px;
            padding: 2rem;
        }
        
        .logo {
            width: 200px;
            height: 200px;
            background: white;
            border-radius: 50%;
            margin: 0 auto 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #dc2626;
            font-weight: bold;
        }
        
        h1 {
            font-size: 4rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }
        
        .subtitle {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        
        .est {
            font-size: 1.2rem;
            opacity: 0.8;
        }
        
        .team-section {
            margin-top: 3rem;
            padding: 2rem;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }
        
        .team-member {
            background: rgba(255,255,255,0.2);
            padding: 1rem;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🐺</div>
        <h1>AI LAB</h1>
        <div class="subtitle">
            The Coyote's <strong>AI powerhouse</strong> on<br>
            <strong>Sustainable innovation</strong> from the<br>
            heart of <strong>Rushmore State</strong>
        </div>
        <div class="est">EST. 2015</div>
        <p style="margin-top: 2rem; font-size: 1.1rem;">University of South Dakota</p>
        
        <div class="team-section">
            <h2 style="font-size: 2rem; margin-bottom: 1rem;">Our Team</h2>
            <div class="team-grid">
                <div class="team-member">
                    <h3>Faculty</h3>
                    <p>Leading AI Research</p>
                </div>
                <div class="team-member">
                    <h3>Staff</h3>
                    <p>Research Support</p>
                </div>
                <div class="team-member">
                    <h3>Students</h3>
                    <p>Future AI Leaders</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
