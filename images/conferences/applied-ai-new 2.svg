<svg xmlns="http:/  <!-- Title Section -->
  <text x="200" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#581c87" letter-spacing="0.5">
    2AI CONFERENCE
  </text>
  
  <!-- Subtitle -->
  <text x="200" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#7c3aed">
    Applied Artificial Intelligence
  </text>rg/2000/svg" viewBox="0 0 400 240" style="background: linear-gradient(135deg, #581c87 0%, #7c3aed 50%, #a78bfa 100%);">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Main Applied AI Badge -->
  <rect x="50" y="40" width="300" height="160" rx="20" fill="white" opacity="0.95" filter="url(#shadow)"/>
  
  <!-- Title Section -->
  <text x="200" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#581c87">
    2AI CONFERENCE
  </text>
  
  <!-- Subtitle -->
  <text x="200" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#7c3aed">
    Applied Artificial Intelligence
  </text>
  
  <!-- Animated Applied AI Network -->
  <g transform="translate(200, 130)">
    <!-- Central Brain -->
    <circle r="12" fill="#7c3aed" stroke="#ffffff" stroke-width="2">
      <animate attributeName="r" values="12;15;12" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Application Nodes -->
    <g opacity="0.9">
      <circle cx="-25" cy="-15" r="5" fill="#a78bfa">
        <animate attributeName="fill-opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="25" cy="-15" r="5" fill="#a78bfa">
        <animate attributeName="fill-opacity" values="0.6;1;0.6" dur="2.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-30" cy="15" r="5" fill="#a78bfa">
        <animate attributeName="fill-opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="30" cy="15" r="5" fill="#a78bfa">
        <animate attributeName="fill-opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="30" r="5" fill="#a78bfa">
        <animate attributeName="fill-opacity" values="0.6;1;0.6" dur="1.9s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Connection Lines -->
      <g stroke="#7c3aed" stroke-width="2" opacity="0.6">
        <line x1="0" y1="0" x2="-20" y2="-12">
          <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
        </line>
        <line x1="0" y1="0" x2="20" y2="-12">
          <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.3s" repeatCount="indefinite"/>
        </line>
        <line x1="0" y1="0" x2="-25" y2="12">
          <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.7s" repeatCount="indefinite"/>
        </line>
        <line x1="0" y1="0" x2="25" y2="12">
          <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.6s" repeatCount="indefinite"/>
        </line>
        <line x1="0" y1="0" x2="0" y2="25">
          <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.0s" repeatCount="indefinite"/>
        </line>
      </g>
    </g>
    
    <!-- Central AI Symbol -->
    <text y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
      2AI
    </text>
  </g>
  
  <!-- Conference Focus -->
  <text x="200" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#374151">
    Real-World AI Solutions &amp; Impact
  </text>
  
  <!-- Industry Badge -->
  <rect x="110" y="176" width="180" height="22" rx="11" fill="#581c87" opacity="0.8"/>
  <text x="200" y="191" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">
    INDUSTRY VALIDATED
  </text>
  
  <!-- Business Value Indicators -->
  <g opacity="0.7">
    <!-- ROI Chart -->
    <path d="M80,120 L90,115 L100,110 L110,105 L120,100" 
          stroke="#a78bfa" stroke-width="2" fill="none">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </path>
    
    <!-- Success Metrics -->
    <rect x="290" y="110" width="8" height="15" fill="#a78bfa" opacity="0.7">
      <animate attributeName="height" values="15;25;15" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="110;100;110" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="302" y="108" width="8" height="20" fill="#7c3aed" opacity="0.7">
      <animate attributeName="height" values="20;30;20" dur="2.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="108;98;108" dur="2.3s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Applied AI Stats -->
  <text x="80" y="210" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#581c87">
    500+ Deployments
  </text>
  <text x="200" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#581c87">
    Fortune 100 Partners
  </text>
  <text x="320" y="210" text-anchor="end" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#581c87">
    98% Success Rate
  </text>
</svg>
