<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USD AI Research Lab</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages - BrowserRouter Compatible
      // Store the current path and redirect to index.html
      var currentPath = window.location.pathname;
      var currentSearch = window.location.search;
      var currentHash = window.location.hash;
      
      // For root path, just redirect to index.html
      if (currentPath === '/' || currentPath === '/404.html') {
        window.location.replace(window.location.origin + '/');
      } else {
        // Store the current URL in sessionStorage so it can be restored
        sessionStorage.setItem('redirectUrl', currentPath + currentSearch + currentHash);
        window.location.replace(window.location.origin + '/');
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <p>Redirecting to USD AI Research...</p>
  </body>
</html>
