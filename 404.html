<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USD AI Research Lab</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages - Safari Compatible
      // HashRouter compatible redirect for 404 pages
      var pathToConvert = window.location.pathname.slice(1);
      window.location.replace(
        window.location.origin + 
        '/#/' + 
        pathToConvert + 
        (window.location.search || '') +
        (window.location.hash || '')
      );
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <p>Redirecting to USD AI Research...</p>
  </body>
</html>
