<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>USD AI Research Lab</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with just a query string and hash fragment,
      // which allows the SPA to function correctly with BrowserRouter.
      var pathToConvert = location.pathname.slice(1);
      location.replace(
        location.origin + 
        '/?/' + 
        pathToConvert + 
        (location.search || '') +
        (location.hash || '')
      );
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <p>Redirecting to USD AI Research...</p>
  </body>
</html>
