<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- Coyote/Wolf figure - only red outline and details -->
  <g fill="none" stroke="#cc4940" stroke-width="3">
    <!-- Wolf head outline -->
    <path d="M50 200 Q80 150 120 160 Q160 140 200 180 Q220 200 210 240 Q200 280 160 300 Q120 320 80 300 Q40 280 30 240 Q20 200 50 200" fill="#cc4940"/>
    
    <!-- Wolf ears -->
    <path d="M90 160 L100 130 L110 160" fill="#cc4940"/>
    <path d="M150 155 L165 125 L175 155" fill="#cc4940"/>
    
    <!-- Wolf snout -->
    <path d="M180 200 Q200 210 195 230 Q190 240 170 235" fill="#cc4940"/>
    
    <!-- Wolf body -->
    <path d="M160 300 Q180 320 220 330 Q280 340 320 320 Q360 300 380 280 Q400 260 390 240" fill="#cc4940"/>
    
    <!-- Wolf legs -->
    <path d="M200 330 L195 380 L205 380 L210 330" fill="#cc4940"/>
    <path d="M240 335 L235 385 L245 385 L250 335" fill="#cc4940"/>
    <path d="M320 335 L315 385 L325 385 L330 335" fill="#cc4940"/>
    <path d="M350 330 L345 380 L355 380 L360 330" fill="#cc4940"/>
    
    <!-- Wolf tail -->
    <path d="M390 240 Q420 220 450 240 Q470 260 460 290 Q450 320 420 330" fill="#cc4940"/>
  </g>
  
  <!-- Decorative dots along the wolf -->
  <g fill="#cc4940">
    <circle cx="100" cy="220" r="3"/>
    <circle cx="120" cy="240" r="3"/>
    <circle cx="140" cy="260" r="3"/>
    <circle cx="160" cy="280" r="3"/>
    <circle cx="180" cy="300" r="3"/>
    <circle cx="200" cy="320" r="3"/>
    <circle cx="220" cy="315" r="3"/>
    <circle cx="240" cy="310" r="3"/>
    <circle cx="260" cy="305" r="3"/>
    <circle cx="280" cy="300" r="3"/>
    <circle cx="300" cy="295" r="3"/>
    <circle cx="320" cy="290" r="3"/>
    <circle cx="340" cy="285" r="3"/>
    <circle cx="360" cy="280" r="3"/>
    <circle cx="380" cy="275" r="3"/>
    <circle cx="400" cy="270" r="3"/>
    <circle cx="420" cy="265" r="3"/>
    <circle cx="440" cy="260" r="3"/>
  </g>
  
  <!-- Letter "A" -->
  <g fill="#cc4940">
    <path d="M500 300 L530 100 L560 100 L590 300 L570 300 L565 250 L525 250 L520 300 Z M535 200 L555 200 L550 150 Z"/>
  </g>
  
  <!-- Letter "I" -->
  <g fill="#cc4940">
    <rect x="650" y="100" width="30" height="200"/>
    <rect x="640" y="100" width="50" height="20"/>
    <rect x="640" y="280" width="50" height="20"/>
  </g>
</svg>
