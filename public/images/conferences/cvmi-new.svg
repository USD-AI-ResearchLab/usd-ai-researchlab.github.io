<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #475569 100%);">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Main CVMI Badge -->
  <rect x="50" y="40" width="300" height="160" rx="20" fill="white" opacity="0.95" filter="url(#shadow)"/>
  
  <!-- Title Section -->
  <text x="200" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0f172a">
    CVMI LAB
  </text>
  
  <!-- Full Name -->
  <text x="200" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="600" fill="#1e293b">
    Computer Vision &amp; Medical Imaging
  </text>
  
  <!-- Medical Cross with Animation -->
  <g transform="translate(200, 115)">
    <!-- Medical Cross -->
    <rect x="-14" y="-3" width="28" height="6" fill="#1e293b" rx="3"/>
    <rect x="-3" y="-14" width="6" height="28" fill="#1e293b" rx="3"/>
    
    <!-- Scanning Ring -->
    <circle r="20" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Medical Focus -->
  <text x="200" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#374151">
    Medical AI &amp; Diagnostic Systems
  </text>
  
  <!-- Clinical Badge -->
  <rect x="85" y="170" width="230" height="20" rx="10" fill="#0f172a" opacity="0.85"/>
  <text x="200" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white" letter-spacing="0.3">
    CLINICAL AI INTEGRATION
  </text>
</svg>
