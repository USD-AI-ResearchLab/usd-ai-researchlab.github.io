<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" style="background: linear-gradient(135deg, #1e40af 0%, #3b82f6 50%, #60a5fa 100%);">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Main IEEE Badge -->
  <rect x="50" y="40" width="300" height="160" rx="20" fill="white" opacity="0.95" filter="url(#shadow)"/>
  
  <!-- IEEE Logo -->
  <rect x="170" y="52" width="60" height="18" rx="4" fill="#1e40af"/>
  <text x="200" y="63" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    IEEE
  </text>
  
  <!-- Conference Title -->
  <text x="200" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1e40af">
    CAI CONFERENCE
  </text>
  
  <!-- Subtitle -->
  <text x="200" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="600" fill="#3b82f6">
    Computational Intelligence &amp; AI
  </text>
  
  <!-- Animated Neural Network -->
  <g transform="translate(200, 125)">
    <!-- Central Node -->
    <circle r="7" fill="#3b82f6">
      <animate attributeName="r" values="7;9;7" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Connected Nodes -->
    <circle cx="-18" cy="0" r="4" fill="#60a5fa" opacity="0.7">
      <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="18" cy="0" r="4" fill="#60a5fa" opacity="0.7">
      <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="1.7s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Conference Details -->
  <text x="200" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#374151">
    Computational Intelligence &amp; AI
  </text>
  
  <!-- Year Badge -->
  <rect x="145" y="170" width="110" height="20" rx="10" fill="#1e40af" opacity="0.85"/>
  <text x="200" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">
    2026 EDITION
  </text>
</svg>
