<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" style="background: linear-gradient(135deg, #1e40af 0%, #3b82f6 50%, #60a5fa 100%);">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Main IEEE Badge -->
  <rect x="50" y="40" width="300" height="160" rx="20" fill="white" opacity="0.95" filter="url(#shadow)"/>
  
  <!-- IEEE Logo -->
  <rect x="170" y="55" width="60" height="25" rx="5" fill="#1e40af"/>
  <text x="200" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    IEEE
  </text>
  
  <!-- Conference Title -->
  <text x="200" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e40af">
    CAI CONFERENCE
  </text>
  
  <!-- Animated Neural Network -->
  <g transform="translate(200, 130)">
    <!-- Central Node -->
    <circle r="8" fill="#3b82f6">
      <animate attributeName="r" values="8;10;8" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Connected Nodes -->
    <circle cx="-25" cy="0" r="5" fill="#60a5fa">
      <animate attributeName="fill-opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="25" cy="0" r="5" fill="#60a5fa">
      <animate attributeName="fill-opacity" values="0.6;1;0.6" dur="1.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="-20" r="5" fill="#60a5fa">
      <animate attributeName="fill-opacity" values="0.6;1;0.6" dur="1.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="20" r="5" fill="#60a5fa">
      <animate attributeName="fill-opacity" values="0.6;1;0.6" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Connection Lines -->
    <line x1="0" y1="0" x2="-25" y2="0" stroke="#3b82f6" stroke-width="2" opacity="0.7">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="25" y2="0" stroke="#3b82f6" stroke-width="2" opacity="0.7">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.2s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="0" y2="-20" stroke="#3b82f6" stroke-width="2" opacity="0.7">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="1.8s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="0" y2="20" stroke="#3b82f6" stroke-width="2" opacity="0.7">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.4s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Conference Details -->
  <text x="200" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#374151">
    Computational Intelligence &amp; AI
  </text>
  
  <!-- Year Badge -->
  <rect x="170" y="175" width="60" height="18" rx="9" fill="#1e40af" opacity="0.8"/>
  <text x="200" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    2026 EDITION
  </text>
  
  <!-- Technical Indicators -->
  <g opacity="0.6">
    <rect x="80" y="90" width="12" height="3" fill="#60a5fa">
      <animate attributeName="width" values="12;18;12" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="80" y="96" width="15" height="3" fill="#3b82f6">
      <animate attributeName="width" values="15;22;15" dur="2.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="80" y="102" width="10" height="3" fill="#1e40af">
      <animate attributeName="width" values="10;16;10" dur="1.9s" repeatCount="indefinite"/>
    </rect>
    
    <rect x="308" y="88" width="12" height="4" fill="#60a5fa">
      <animate attributeName="width" values="12;18;12" dur="2.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="308" y="95" width="15" height="4" fill="#3b82f6">
      <animate attributeName="width" values="15;22;15" dur="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Conference Stats -->
  <text x="100" y="210" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#1e40af">
    500+ Papers
  </text>
  <text x="200" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#1e40af">
    50+ Countries
  </text>
  <text x="300" y="210" text-anchor="end" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#1e40af">
    Industry Leaders
  </text>
</svg>
