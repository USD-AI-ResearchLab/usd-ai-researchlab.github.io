<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" style="background: linear-gradient(135deg, #581c87 0%, #7c3aed 50%, #a78bfa 100%);">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Main Applied AI Badge -->
  <rect x="50" y="40" width="300" height="160" rx="20" fill="white" opacity="0.95" filter="url(#shadow)"/>
  
  <!-- Title Section -->
  <text x="200" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#581c87">
    2AI CONFERENCE
  </text>
  
  <!-- Subtitle -->
  <text x="200" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="600" fill="#7c3aed">
    Applied Artificial Intelligence
  </text>
  
  <!-- Animated Applied AI Network -->
  <g transform="translate(200, 115)">
    <!-- Central Brain -->
    <circle r="10" fill="#7c3aed" stroke="#ffffff" stroke-width="1.5" opacity="0.9">
      <animate attributeName="r" values="10;13;10" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Application Nodes -->
    <circle cx="-18" cy="-12" r="4" fill="#a78bfa" opacity="0.7">
      <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="18" cy="-12" r="4" fill="#a78bfa" opacity="0.7">
      <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="18" r="4" fill="#a78bfa" opacity="0.7">
      <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="1.9s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Conference Focus -->
  <text x="200" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#374151">
    Real-World AI Solutions &amp; Impact
  </text>
  
  <!-- Industry Badge -->
  <rect x="110" y="170" width="180" height="20" rx="10" fill="#581c87" opacity="0.85"/>
  <text x="200" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">
    INDUSTRY VALIDATED
  </text>
</svg>
