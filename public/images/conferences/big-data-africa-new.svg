<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" style="background: linear-gradient(135deg, #1a3a2a 0%, #245c3d 50%, #1a472a 100%);">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Main Conference Badge -->
  <rect x="50" y="40" width="300" height="160" rx="20" fill="white" opacity="0.95" filter="url(#shadow)"/>
  
  <!-- Conference Title -->
  <text x="200" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a472a" letter-spacing="0.5">
    BIG DATA AFRICA
  </text>
  
  <!-- Subtitle -->
  <text x="200" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#f59e0b">
    Symposium 2026
  </text>
  
  <!-- Animated Data Network Visualization -->
  <g transform="translate(200, 130)">
    <!-- Data nodes with animation -->
    <circle cx="-40" cy="0" r="6" fill="#f59e0b" opacity="0.8">
      <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="5" fill="#f59e0b" opacity="0.9">
      <animate attributeName="r" values="5;7;5" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="0" r="6" fill="#f59e0b" opacity="0.8">
      <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Connecting lines -->
    <line x1="-34" y1="0" x2="-6" y2="0" stroke="#f59e0b" stroke-width="2" opacity="0.6">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="6" y1="0" x2="34" y2="0" stroke="#f59e0b" stroke-width="2" opacity="0.6">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
    </line>
    
    <!-- Additional data points -->
    <circle cx="-25" cy="-18" r="3" fill="#f59e0b" opacity="0.6">
      <animate attributeName="cy" values="-18;-22;-18" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="25" cy="18" r="3" fill="#f59e0b" opacity="0.6">
      <animate attributeName="cy" values="18;22;18" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Conference Focus Areas -->
  <text x="200" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#374151">
    Digital Transformation &amp; AI
  </text>
  
  <!-- Tagline Badge -->
  <rect x="60" y="178" width="280" height="22" rx="11" fill="#f59e0b" opacity="0.8"/>
  <text x="200" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white" letter-spacing="0.3">
    Connecting Africa Through Data &amp; Intelligence
  </text>
</svg>
