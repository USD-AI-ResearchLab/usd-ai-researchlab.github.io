<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" style="background: linear-gradient(135deg, #1e40af 0%, #3b82f6 50%, #60a5fa 100%);">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Main Conference Badge -->
  <rect x="50" y="40" width="300" height="160" rx="20" fill="white" opacity="0.95" filter="url(#shadow)"/>
  
  <!-- Title Section -->
  <text x="200" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1e40af">
    AI SYMPOSIUM
  </text>
  
  <!-- Animated University Logo -->
  <g transform="translate(200, 120)">
    <circle r="25" fill="#3b82f6" opacity="0.9">
      <animate attributeName="r" values="25;28;25" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
      USD
    </text>
  </g>
  
  <!-- Floating AI Elements -->
  <g opacity="0.7">
    <circle cx="100" cy="100" r="4" fill="#60a5fa">
      <animate attributeName="cy" values="100;90;100" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="140" r="3" fill="#3b82f6">
      <animate attributeName="cy" values="140;130;140" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="160" r="2" fill="#1e40af">
      <animate attributeName="cy" values="160;150;160" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Conference Details -->
  <text x="200" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#374151">
    Leading AI Research &amp; Innovation
  </text>
  
  <!-- Date Badge -->
  <rect x="150" y="170" width="100" height="20" rx="10" fill="#1e40af" opacity="0.8"/>
  <text x="200" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
  </text>
  
  <!-- Side Decorations -->
  <rect x="20" y="60" width="4" height="40" fill="#60a5fa" opacity="0.6">
    <animate attributeName="height" values="40;50;40" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="376" y="80" width="4" height="30" fill="#3b82f6" opacity="0.6">
    <animate attributeName="height" values="30;40;30" dur="2.2s" repeatCount="indefinite"/>
  </rect>
</svg>
