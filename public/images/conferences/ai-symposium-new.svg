<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" style="background: linear-gradient(135deg, #1e40af 0%, #3b82f6 50%, #60a5fa 100%);">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Main Conference Badge -->
  <rect x="50" y="40" width="300" height="160" rx="20" fill="white" opacity="0.95" filter="url(#shadow)"/>
  
  <!-- Title Section -->
  <text x="200" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e40af">
    AI SYMPOSIUM
  </text>
  
  <!-- Subtitle -->
  <text x="200" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="600" fill="#3b82f6">
    Leading AI Research &amp; Innovation
  </text>
  
  <!-- Animated University Logo -->
  <g transform="translate(200, 115)">
    <circle r="16" fill="#3b82f6" opacity="0.9">
      <animate attributeName="r" values="16;19;16" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
      USD
    </text>
  </g>
  
  <!-- Conference Focus -->
  <text x="200" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#374151">
    Annual Symposium Event
  </text>
  
  <!-- Symposium Badge -->
  <rect x="115" y="170" width="170" height="20" rx="10" fill="#1e40af" opacity="0.85"/>
  <text x="200" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">
    AI Annual Symposium
  </text>
</svg>
