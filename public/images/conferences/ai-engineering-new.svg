<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" style="background: linear-gradient(135deg, #1f2937 0%, #374151 50%, #6b7280 100%);">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Main Engineering Badge -->
  <rect x="50" y="40" width="300" height="160" rx="20" fill="white" opacity="0.95" filter="url(#shadow)"/>
  
  <!-- Title Section -->
  <text x="200" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1f2937">
    AI ENGINEERING
  </text>
  
  <!-- Subtitle -->
  <text x="200" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="600" fill="#374151">
    Intelligent Systems &amp; Automation
  </text>
  
  <!-- Animated Mechanical Gear -->
  <g transform="translate(200, 115)">
    <!-- Main Gear Circle -->
    <circle r="18" fill="none" stroke="#374151" stroke-width="2" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="8s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Central Hub -->
    <circle r="6" fill="#1f2937">
      <animate attributeName="r" values="6;8;6" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Specialty Description -->
  <text x="200" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#374151">
    Intelligent Systems &amp; Automation
  </text>
  
  <!-- Industry Badge -->
  <rect x="110" y="170" width="180" height="20" rx="10" fill="#1f2937" opacity="0.85"/>
  <text x="200" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white" letter-spacing="0.2">
    INDUSTRY 4.0 READY
  </text>
</svg>
