<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" style="background: linear-gradient(135deg, #059669 0%, #10b981 50%, #34d399 100%);">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Main Club Badge -->
  <rect x="50" y="40" width="300" height="160" rx="20" fill="white" opacity="0.95" filter="url(#shadow)"/>
  
  <!-- Title Section -->
  <text x="200" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#059669">
    AI CLUB
  </text>
  
  <!-- Animated Student Hub -->
  <g transform="translate(200, 120)">
    <polygon points="0,-20 18,-6 18,6 0,20 -18,6 -18,-6" fill="#10b981" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="8s" repeatCount="indefinite"/>
    </polygon>
    <circle r="12" fill="#059669"/>
    <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
      AI
    </text>
  </g>
  
  <!-- Student Activity Indicators -->
  <g opacity="0.8">
    <rect x="80" y="110" width="8" height="8" fill="#34d399" rx="2">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="95" y="115" width="6" height="6" fill="#10b981" rx="1">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="108" y="112" width="7" height="7" fill="#059669" rx="1.5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.1s" repeatCount="indefinite"/>
    </rect>
    
    <rect x="285" y="108" width="9" height="9" fill="#34d399" rx="2">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="300" y="113" width="7" height="7" fill="#10b981" rx="1">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.9s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Club Description -->
  <text x="200" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#374151">
    Student Innovation &amp; Learning Hub
  </text>
  
  <!-- Membership Badge -->
  <rect x="140" y="170" width="120" height="20" rx="10" fill="#059669" opacity="0.8"/>
  <text x="200" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    150+ ACTIVE MEMBERS
  </text>
  
  <!-- Project Indicators -->
  <circle cx="70" cy="170" r="3" fill="#10b981">
    <animate attributeName="r" values="3;5;3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <text x="85" y="175" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#059669">
    Projects
  </text>
  
  <circle cx="320" cy="170" r="3" fill="#34d399">
    <animate attributeName="r" values="3;5;3" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <text x="290" y="175" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#059669">
    Competitions
  </text>
</svg>
