<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" style="background: linear-gradient(135deg, #059669 0%, #10b981 50%, #34d399 100%);">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Main Club Badge -->
  <rect x="50" y="40" width="300" height="160" rx="20" fill="white" opacity="0.95" filter="url(#shadow)"/>
  
  <!-- Conference Title -->
  <text x="200" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#059669">
    AI CLUB
  </text>
  
  <!-- Subtitle -->
  <text x="200" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="600" fill="#047857">
    Student Innovation &amp; Learning Hub
  </text>
  
  <!-- Decorative squares left -->
  <rect x="120" y="110" width="6" height="6" rx="2" fill="#10b981" opacity="0.5"/>
  <rect x="132" y="114" width="5" height="5" rx="1.5" fill="#10b981" opacity="0.4"/>
  <rect x="142" y="110" width="6" height="6" rx="2" fill="#10b981" opacity="0.5"/>
  
  <!-- Center hexagon with "AI" -->
  <g transform="translate(200, 125)">
    <polygon points="0,-14 12,-7 12,7 0,14 -12,7 -12,-7" fill="#10b981" stroke="#ffffff" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
      AI
    </text>
  </g>
  
  <!-- Decorative squares right -->
  <rect x="252" y="110" width="6" height="6" rx="2" fill="#10b981" opacity="0.5"/>
  <rect x="263" y="114" width="5" height="5" rx="1.5" fill="#10b981" opacity="0.4"/>
  <rect x="274" y="110" width="6" height="6" rx="2" fill="#10b981" opacity="0.5"/>
  
  <!-- Bottom content -->
  <text x="200" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#374151">
    Projects • Competitions
  </text>
  
  <!-- Bottom badge -->
  <rect x="120" y="170" width="160" height="20" rx="10" fill="#059669" opacity="0.85"/>
  <text x="200" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white" letter-spacing="0.3">
    50+ ACTIVE MEMBERS
  </text>
</svg>
